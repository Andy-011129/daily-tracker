<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daily Tracker</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#20242b;--muted:#858b96;--line:#e9ebef;--blue:#438ee8;--green:#29ad91;--orange:#e4a13c;--purple:#987bd1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 19px calc(34px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{font-size:13px;letter-spacing:2px;font-weight:750}.date{font-size:13px;color:var(--muted)}
.summary{background:#202630;color:white;border-radius:23px;padding:22px 22px 20px;margin-bottom:17px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#b9c0ca}.grand{font-size:39px;font-weight:650;letter-spacing:-1.5px;margin:8px 0 2px}.sub{font-size:12px;color:#c1c7d0}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 12px}.sectionhead h2{font-size:15px;margin:0}.sectionhead span{font-size:11px;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:16px 14px 14px;min-height:143px;display:flex;flex-direction:column;justify-content:space-between}.tile.active{border:2px solid var(--c);padding:15px 13px 13px;box-shadow:0 5px 18px color-mix(in srgb,var(--c) 13%,transparent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:5px}.name{font-size:14px;font-weight:650}.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}.status{font-size:10px;color:var(--c);font-weight:650}.time{font-size:25px;letter-spacing:-.8px;font-weight:620;margin:13px 0 10px}
.action{border:0;border-radius:11px;background:var(--c);color:white;font-weight:650;font-size:12px;padding:10px 12px;width:100%;cursor:pointer}.tile:not(.active) .action{background:color-mix(in srgb,var(--c) 13%,white);color:var(--c)}
.report{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:17px}.bar{display:flex;height:13px;border-radius:20px;overflow:hidden;background:#edf0f3;gap:2px;margin:16px 0}.bar span{height:100%;min-width:0}.legend{display:grid;gap:13px}.legendrow{display:flex;align-items:center;justify-content:space-between;font-size:12px}.legendname{display:flex;align-items:center;gap:9px}.legendname i{width:9px;height:9px;border-radius:50%}.legendval{color:#626975}
.controls{display:flex;gap:9px;margin-top:16px}.secondary{flex:1;border:1px solid var(--line);background:white;border-radius:12px;padding:11px;font-size:12px;color:#525a65}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin:17px 3px}.history{display:flex;justify-content:space-between;align-items:center;margin-top:17px}.history input{border:1px solid var(--line);border-radius:10px;padding:8px;background:white;color:var(--ink)}
#toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#202630;color:#fff;padding:11px 16px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;white-space:nowrap}#toast.show{opacity:1}
@media(max-width:360px){.time{font-size:22px}.tile{padding:13px 11px}}
</style>
</head>
<body>
<main>
<header><div class="brand">DAILY TRACKER</div><div class="date" id="dateLabel"></div></header>
<section class="summary"><div class="eyebrow">TODAY'S TOTAL</div><div class="grand" id="total">00:00:00</div><div class="sub" id="activeLabel">今天还没有开始记录</div></section>
<div class="sectionhead"><h2>活动计时</h2><span>同一时间仅运行一个</span></div>
<section class="cards" id="cards"></section>
<div class="sectionhead"><h2>今日统计</h2><span id="reportDate"></span></div>
<section class="report">
<div class="eyebrow" style="color:#858b96">TIME DISTRIBUTION</div>
<div class="bar" id="bar"></div><div class="legend" id="legend"></div>
<div class="history"><span style="font-size:12px;font-weight:650">查看历史日期</span><input id="historyDate" type="date"></div>
</section>
<div class="controls"><button class="secondary" id="notifyBtn">开启 23:00 提醒</button><button class="secondary" id="resetBtn">清除本机数据</button></div>
<p class="note">数据仅保存在此设备的浏览器本地。计时依据开始/停止时间戳计算，切换应用或重新打开后会自动补算。请勿清除 Safari 网站数据，否则本地记录可能丢失。23:00 提醒需要应用保持打开；iOS 网页应用无法保证关闭后准时触发本地通知。</p>
</main><div id="toast"></div>
<script>
const TYPES=[
 {id:"lab",name:"实验",color:"#438ee8"},
 {id:"english",name:"英语口语",color:"#29ad91"},
 {id:"info",name:"信息输入",color:"#e4a13c"},
 {id:"other",name:"其它活动",color:"#987bd1"}
];
const KEY="dailyTracker.v1";
let state=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{sessions:[],active:null,remindedDate:null}}catch(e){return {sessions:[],active:null,remindedDate:null}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function pad(n){return String(n).padStart(2,"0")}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`}
function dayKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dayStart(key){return new Date(key+"T00:00:00").getTime()}
function getTotals(key){
 const start=dayStart(key),end=start+86400000, totals={lab:0,english:0,info:0,other:0};
 const all=state.sessions.slice();if(state.active)all.push(state.active);
 for(const s of all){const a=Math.max(start,s.start),b=Math.min(end,s.end||Date.now());if(b>a)totals[s.id]+=(b-a)/1000}
 return totals;
}
function switchTo(id){
 const now=Date.now();
 if(state.active&&state.active.id===id){state.sessions.push({...state.active,end:now});state.active=null}
 else {if(state.active)state.sessions.push({...state.active,end:now});state.active={id,start:now}}
 save();render();
}
function render(){
 const now=new Date(),today=dayKey(now),selected=document.getElementById("historyDate").value||today;
 document.getElementById("dateLabel").textContent=now.toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"short"});
 const t=getTotals(today),sum=Object.values(t).reduce((a,b)=>a+b,0);
 document.getElementById("total").textContent=fmt(sum);
 const activeType=TYPES.find(x=>state.active&&x.id===state.active.id);
 document.getElementById("activeLabel").textContent=activeType?`正在记录：${activeType.name}`:"当前没有计时器运行";
 document.getElementById("cards").innerHTML=TYPES.map(x=>`<article class="tile ${state.active?.id===x.id?"active":""}" style="--c:${x.color}"><div class="top"><div style="display:flex;align-items:center;gap:8px"><i class="dot"></i><span class="name">${x.name}</span></div>${state.active?.id===x.id?'<span class="status">● 计时中</span>':''}</div><div class="time">${fmt(t[x.id])}</div><button class="action" data-id="${x.id}">${state.active?.id===x.id?"停止计时":"开始计时"}</button></article>`).join("");
 document.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>switchTo(b.dataset.id)));
 document.getElementById("reportDate").textContent=selected===today?"今天":selected;
 const rt=getTotals(selected),rSum=Object.values(rt).reduce((a,b)=>a+b,0);
 document.getElementById("bar").innerHTML=TYPES.map(x=>`<span style="width:${rSum?rt[x.id]/rSum*100:0}%;background:${x.color}"></span>`).join("");
 document.getElementById("legend").innerHTML=TYPES.map(x=>`<div class="legendrow"><div class="legendname"><i style="background:${x.color}"></i>${x.name}</div><div class="legendval">${fmt(rt[x.id])}　${rSum?(rt[x.id]/rSum*100).toFixed(1):"0.0"}%</div></div>`).join("");
}
function toast(s){const el=document.getElementById("toast");el.textContent=s;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2300)}
document.getElementById("historyDate").value=dayKey(new Date());
document.getElementById("historyDate").addEventListener("change",render);
document.getElementById("resetBtn").addEventListener("click",()=>{if(confirm("确定清除本机全部计时记录？此操作不可撤销。")){state={sessions:[],active:null,remindedDate:null};save();render();toast("本机记录已清除")}});
document.getElementById("notifyBtn").addEventListener("click",async()=>{
 if(!("Notification" in window)){toast("当前浏览器不支持通知");return}
 const p=await Notification.requestPermission();toast(p==="granted"?"通知权限已开启（应用打开时可提醒）":"未获得通知权限");
});
function checkReminder(){
 const now=new Date(),key=dayKey(now);
 if(now.getHours()===23&&state.remindedDate!==key){
  state.remindedDate=key;save();
  if("Notification"in window&&Notification.permission==="granted")new Notification("Daily Tracker",{body:"今天的时间记录已汇总，打开应用查看统计图。"});
  else toast("23:00：今天的时间记录已汇总，记得查看日报");
 }
}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();setInterval(()=>{render();checkReminder()},1000);checkReminder();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();checkReminder()}});
</script>
</body></html>
